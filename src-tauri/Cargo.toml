[package]
name = "meld-desktop"
version = "0.1.0"
description = "Meld Desktop — a Windows-native GPLv3 port of Meld"
authors = ["Meld contributors"]
edition = "2021"
license = "GPL-3.0-only"
rust-version = "1.89"
repository = "https://github.com/Romany-Osama/Meld-Desktop"

[lib]
name = "meld_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "brotli", "deflate", "stream"] }
tokio = { version = "1", features = ["fs", "io-util", "sync", "time"] }
regex = "1"
sha1 = "0.10"
base64 = "0.22"
hmac = "0.12"
rusqlite = { version = "0.32", features = ["bundled"] }
lofty = "0.22"
rfd = "0.15"
zip = "2"
futures-util = "0.3"
url = "2"
aes-gcm = "0.10"
keyring = { version = "3", default-features = false, features = ["windows-native"] }

[profile.release]
lto = "thin"
strip = true
